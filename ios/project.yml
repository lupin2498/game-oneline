name: OneLine
options:
  bundleIdPrefix: vn.lupin
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.0"

targets:
  OneLine:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: www
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.lupin.oneline
        PRODUCT_NAME: OneLine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Một Nét
        CFBundleShortVersionString: "1.5"
        CFBundleVersion: "6"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown

  # UI test chạy trên iOS Simulator: bấm, GIỮ và KÉO thật trong WKWebView (xcodebuild test)
  OneLineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: OneLine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.lupin.oneline.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OneLine

schemes:
  OneLine:
    build:
      targets:
        OneLine: all
        OneLineUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OneLineUITests
    archive:
      config: Release
