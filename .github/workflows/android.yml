name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'dist/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK (không cần Android SDK)
        run: bash android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: OneLine-apk
          path: dist/*.apk
          if-no-files-found: error
