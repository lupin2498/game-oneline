<script>
(function(){
'use strict';
var VERSION='1.5';
var cv=document.getElementById('cv'), ctx=cv.getContext('2d'), wrap=document.getElementById('wrap'), ui=document.getElementById('ui');
var W=480, H=760, STEP=92, Y_MIN=H*0.15, Y_MAX=H*0.78, R=6.5, M2PX=22;
var JX=240, JY=680, JR=58, JK=25, JT=46;  // nút tròn: tâm, bán kính nền, bán kính núm, tầm lệch núm
function $(id){ return document.getElementById(id); }
function log(m){ try{ console.log('[oneline] '+m); }catch(e){} }   // hiện trong adb logcat / Web Inspector
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rnd(a,b){return a+Math.random()*(b-a);}

/* ---------- co giãn khung chơi ---------- */
var fitW=-1, fitH=-1, fitD=-1, fitOK=false, booted=0;
function viewDpr(){ return Math.min(window.devicePixelRatio||1,2.5); }
function fit(){
  var de=document.documentElement;
  var vw=window.innerWidth||de.clientWidth||0, vh=window.innerHeight||de.clientHeight||0, dpr=viewDpr();
  fitW=window.innerWidth; fitH=window.innerHeight; fitD=dpr;
  try{                                       // trừ vùng tai thỏ / thanh home (padding env() của body)
    var cs=window.getComputedStyle(document.body);
    vw-=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
    vh-=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  }catch(e){}
  if(!(vw>0 && vh>0)){                       // WebView chưa có kích thước (trang chạy trước khi app dàn xong):
    fitOK=false; wrap.style.visibility='hidden';   // giấu khung để không lộ bố cục chưa co giãn; vòng lặp sẽ gọi lại
    return;
  }
  var w=Math.floor(Math.min(vw, vh*W/H)), h=w*H/W;
  wrap.style.width=w+'px'; wrap.style.height=h+'px'; wrap.style.maxWidth='none'; wrap.style.maxHeight='none';
  cv.width=Math.max(1,Math.round(w*dpr));
  cv.height=Math.max(1,Math.round(h*dpr));
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  var sc='scale('+(w/400)+')';               // HUD + bảng co theo khung
  ui.style.webkitTransform=sc; ui.style.transform=sc;
  if(!fitOK && booted) log('view '+fitW+'x'+fitH+' t='+(Date.now()-booted));   // có kích thước muộn
  fitOK=true; wrap.style.visibility='';
}
function refit(){ if(!fitOK || window.innerWidth!==fitW || window.innerHeight!==fitH || viewDpr()!==fitD) fit(); }
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',fit);
// WebView/app có thể chạy trang trước khi có kích thước và không bắn "resize" lúc nhận kích thước đầu tiên (hoặc
// bắn khi kích thước mới đổi một nửa): vòng lặp so lại kích thước ở MỖI khung hình, kèm vài tín hiệu khác phòng khi
// vòng lặp chưa chạy
window.addEventListener('load',refit);
window.addEventListener('pageshow',refit);
document.addEventListener('visibilitychange',refit);
if(window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize',refit);
[0,60,250,1000,3000].forEach(function(ms){ setTimeout(refit,ms); });

/* ---------- mê cung ---------- */
var wps=[];
function hwFor(d){ return Math.max(12.5, 54-d*0.0062); }
function pushWp(){
  var prev=wps[wps.length-1], d=prev.y;
  var hw=hwFor(d)*rnd(.92,1.08);
  if(Math.random()<.16) hw*=0.64;                 // cửa thắt
  hw=Math.max(11,hw);
  var jump=Math.min(205,72+d*0.022);
  var x=prev.x+rnd(-jump,jump), m=hw+13;
  if(x<m) x=m+(m-x)*0.45;
  if(x>W-m) x=W-m-(x-(W-m))*0.45;
  wps.push({y:prev.y+STEP, x:clamp(x,m,W-m), hw:hw});
}
function ensure(upto){ while(wps[wps.length-1].y<upto) pushWp(); }
function corridor(wy){
  var i=Math.floor((wy-wps[0].y)/STEP);
  if(i<0) i=0;
  if(i>wps.length-2) i=wps.length-2;
  var a=wps[i], b=wps[i+1], u=clamp((wy-a.y)/STEP,0,1);
  var s=(1-Math.cos(Math.PI*u))*0.5;
  var x=a.x+(b.x-a.x)*s, hb=a.hw+(b.hw-a.hw)*s;
  var slope=(b.x-a.x)*Math.PI*0.5*Math.sin(Math.PI*u)/STEP;        // dx/dy của đường tâm
  // nới bề ngang theo độ dốc để bề rộng vuông góc với hành lang luôn là hb
  var hw=Math.min(hb*Math.sqrt(1+slope*slope), x-4, W-4-x);
  return {x:x, hw:hw, hb:hb};
}
function sy(wy){ return H-(wy-scroll); }           // world -> screen
function wy(syv){ return scroll+H-syv; }           // screen -> world

/* ---------- trạng thái ---------- */
var state='idle', scroll=0, dist=0, speed=0, best=0;
var dotX=240, dotY=H*0.66, tgtX=240, tgtY=H*0.66, trail=[], sparks=[];
var startX=240, startY=H*0.66, shake=0, time=0, last=0, overReason='', overCode='', hudTick=0, anchor=null;
var mode='drag', stickX=0, stickY=0;   // mode: 'drag' kéo trực tiếp | 'stick' nút tròn
var lastPX=0, lastPY=0, pendX=0, pendY=0;  // nút tròn: vị trí ngón tay lần trước, quãng dời chờ áp dụng
var activeId=null;                         // id của ngón đang vẽ; ngón khác bị bỏ qua
var runStart=0;                            // thời điểm bắt đầu lượt (để ghi log thời lượng)
var REASON={lift:'Nhấc tay rồi!', wall:'Chạm tường!'};
var hD=$('hD'), hB=$('hB'), bW=document.querySelector('#bW em'), bS=document.querySelector('#bS em'),
    pStart=$('pStart'), pOver=$('pOver'), pBoard=$('pBoard'), oTitle=$('oTitle'), oD=$('oD'), oB=$('oB');

try{ best=Math.min(1e7, Math.max(0, parseInt(localStorage.getItem('oneline.best')||'0',10)||0)); }catch(e){ best=0; }
function meters(){ return Math.floor(dist/M2PX); }
function hud(){
  hD.textContent=meters()+' m';
  hB.textContent=best+' m';
  var c=corridor(wy(dotY));
  bW.style.width=Math.round(clamp((c.hb-10)/46,0.04,1)*100)+'%';
  bS.style.width=Math.round(clamp((speed-110)/330,0.03,1)*100)+'%';
}
function reset(){
  wps=[];
  for(var k=0;k<=6;k++) wps.push({y:STEP*k, x:240, hw:54});   // đoạn thẳng khởi động
  scroll=0; dist=0; speed=130; trail=[]; sparks=[];
  ensure(H+STEP*3);
  startY=H*0.66; startX=corridor(wy(startY)).x;
  dotX=tgtX=startX; dotY=tgtY=startY;
  anchor=null; activeId=null; mode='drag'; stickX=stickY=pendX=pendY=0; state='ready'; hud();
}
function lose(code){
  if(state!=='run') return;
  state='over'; shake=1; overCode=code; overReason=REASON[code]||code;
  if(meters()>best){ best=meters(); try{localStorage.setItem('oneline.best',String(best));}catch(e){} }
  oTitle.textContent=overReason; oD.textContent=meters()+' m';
  oB.textContent='Tốt nhất: '+best+' m';
  pOver.classList.remove('hide'); hud();
  log('over reason='+code+' m='+meters()+' best='+best+' mode='+mode+' t='+(Date.now()-runStart));
  netAfterRun(meters());
}
function begin(x,y){
  if(Math.hypot(x-JX,y-JY)<=JR+18) mode='stick';             // giữ nút tròn
  else if(Math.hypot(x-startX,y-startY)<=58) mode='drag';    // giữ vòng sáng
  else return false;
  dotX=tgtX=startX; dotY=tgtY=startY;          // luôn bắt đầu đúng tâm vòng sáng
  anchor={px:x, py:y, dx:startX, dy:startY};   // điểm chạm làm gốc kéo / tâm nút tròn
  stickX=stickY=pendX=pendY=0; lastPX=x; lastPY=y;
  trail=[[dotX,wy(dotY)]];
  state='run'; runStart=Date.now();
  log('run mode='+mode);
  return true;
}

/* ---------- input ---------- */
function pos(cx,cy){
  var r=cv.getBoundingClientRect();
  return [ (cx-r.left)/r.width*W, (cy-r.top)/r.height*H ];
}
function down(id,cx,cy){                   // true nếu lượt chơi bắt đầu bằng ngón này
  if(state!=='ready') return false;
  var p=pos(cx,cy);
  if(!begin(p[0],p[1])) return false;
  activeId=id;
  return true;
}
function move(id,cx,cy){
  if(state!=='run'||!anchor||id!==activeId) return;
  var p=pos(cx,cy), ox=p[0]-anchor.px, oy=p[1]-anchor.py;
  if(mode==='stick'){
    pendX+=p[0]-lastPX; pendY+=p[1]-lastPY;   // nhân vật dời đúng bằng quãng ngón tay dời (1:1)
    lastPX=p[0]; lastPY=p[1];
    var L=Math.hypot(ox,oy);
    if(L>JT){                                  // ngón tay ra quá tầm: kéo nền nút theo
      anchor.px+=ox*(1-JT/L); anchor.py+=oy*(1-JT/L);
      ox=p[0]-anchor.px; oy=p[1]-anchor.py;
    }
    stickX=ox; stickY=oy;
  } else {
    tgtX=clamp(anchor.dx+ox, -60, W+60);
    tgtY=clamp(anchor.dy+oy, Y_MIN, Y_MAX);
  }
}
function up(id){ if(state==='run' && (id===undefined || id===activeId)) lose('lift'); }

if(window.PointerEvent){

    if(e.pointerType==='mouse' && e.button!==0) return;        // chỉ nút chuột trái
    e.preventDefault();
    if(down(e.pointerId,e.clientX,e.clientY) && cv.setPointerCapture){ try{cv.setPointerCapture(e.pointerId);}catch(err){} }
  });

} else {

  var eachTouch=function(e,fn){ for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; fn(t.identifier,t.clientX,t.clientY); } };
  cv.addEventListener('touchstart',function(e){ eachTouch(e,down); },{passive:false});

  window.addEventListener('mouseup',function(){ up('mouse'); });
}

/* ---------- cập nhật ---------- */
function hitWall(){                        // va chạm hình tròn: xét 13 lát ngang trong bán kính chấm
  for(var k=-6;k<=6;k++){
    var dy=k*R/6, ch=Math.sqrt(R*R-dy*dy), c=corridor(wy(dotY+dy));
    if(Math.abs(dotX-c.x)+ch > c.hw+1.5) return true;
  }
  return false;
}
function step(dt){
  time+=dt; shake=Math.max(0,shake-dt*3);
  var i;
  for(i=sparks.length-1;i>=0;i--){
    var s=sparks[i]; s.x+=s.vx*dt; s.wy+=s.vy*dt; s.t-=dt*2.2;
    if(s.t<=0) sparks.splice(i,1);
  }
  if(state!=='run') return;

  speed=Math.min(440,130+dist*0.055);
  var ds=speed*dt;
  scroll+=ds; dist+=ds;
  ensure(scroll+H+STEP*3);
  while(wps.length>6 && wps[1].y<scroll-STEP*2) wps.shift();

  var mvx=0, mvy=0;
  if(mode==='stick'){                       // nút tròn: dời theo đúng quãng ngón tay đã dời
    mvx=pendX; mvy=pendY; pendX=pendY=0;
  } else {                                  // kéo trực tiếp: chạy tới điểm ngón tay
    var dx=tgtX-dotX, dy=tgtY-dotY, L=Math.hypot(dx,dy), mv=Math.min(L,2600*dt);
    if(L>0.0001){ mvx=dx/L*mv; mvy=dy/L*mv; }
  }
  var sub=Math.max(1,Math.ceil(Math.max(Math.hypot(mvx,mvy),ds)/4));
  for(i=0;i<sub;i++){
    dotX=clamp(dotX+mvx/sub,-30,W+30);
    dotY=clamp(dotY+mvy/sub,Y_MIN,Y_MAX);
    if(hitWall()){
      for(var k=0;k<14;k++) sparks.push({x:dotX,wy:wy(dotY),vx:rnd(-150,150),vy:rnd(-150,150),t:1});
      lose('wall'); return;
    }
  }
  trail.push([dotX,wy(dotY)]);
  while(trail.length>2 && sy(trail[0][1])>H+60) trail.shift();
  if(trail.length>1800) trail.shift();
  if((++hudTick&3)===0) hud();
}

/* ---------- vẽ ---------- */
function edges(){
  var L=[], Rr=[], y;
  for(y=-30;y<=H+30;y+=7){
    var c=corridor(wy(y));
    L.push([c.x-c.hw,y]); Rr.push([c.x+c.hw,y]);
  }
  return [L,Rr];
}
function drawBg(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#070d18'); g.addColorStop(.5,'#0a1424'); g.addColorStop(1,'#05090f');
  ctx.fillStyle=g; ctx.fillRect(-12,-12,W+24,H+24);
  ctx.strokeStyle='rgba(125,255,212,.05)'; ctx.lineWidth=1;
  var off=scroll%48;
  for(var y=-48+off;y<H+48;y+=48){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  for(var x=24;x<W;x+=48){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
}
function wallPath(pts,side){
  ctx.beginPath();
  ctx.moveTo(side<0?-10:W+10, pts[0][1]);
  for(var i=0;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.lineTo(side<0?-10:W+10, pts[pts.length-1][1]);
  ctx.closePath();
}
function edgeLine(pts){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
}
function hatch(){
  ctx.strokeStyle='rgba(255,255,255,.055)'; ctx.lineWidth=2;
  var off=scroll%30, k;
  for(k=-H;k<W+H;k+=30){
    ctx.beginPath(); ctx.moveTo(k,-30+off); ctx.lineTo(k+H+60,H+30+off); ctx.stroke();
  }
}
function drawMaze(){
  var e=edges(), L=e[0], Rr=e[1], i;
  var hue=(dist*0.035)%360;
  var col='hsl('+hue+',85%,62%)';
  ctx.beginPath(); ctx.moveTo(L[0][0],L[0][1]);
  for(i=1;i<L.length;i++) ctx.lineTo(L[i][0],L[i][1]);
  for(i=Rr.length-1;i>=0;i--) ctx.lineTo(Rr[i][0],Rr[i][1]);
  ctx.closePath();
  ctx.fillStyle='rgba(120,220,255,.05)'; ctx.fill();
  ctx.fillStyle='#1b2540';
  ctx.save(); wallPath(L,-1); ctx.fill(); ctx.clip(); hatch(); ctx.restore();
  ctx.save(); wallPath(Rr,1); ctx.fill(); ctx.clip(); hatch(); ctx.restore();
  ctx.save();
  ctx.globalAlpha=.35; ctx.lineWidth=14; ctx.strokeStyle=col;
  edgeLine(L); ctx.stroke(); edgeLine(Rr); ctx.stroke();
  ctx.restore();
  ctx.lineWidth=3; ctx.strokeStyle=col;
  edgeLine(L); ctx.stroke(); edgeLine(Rr); ctx.stroke();
  ctx.lineWidth=1.2; ctx.strokeStyle='rgba(255,255,255,.75)';
  edgeLine(L); ctx.stroke(); edgeLine(Rr); ctx.stroke();
}
function drawTrail(){
  if(trail.length<2) return;
  var i, p;
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(trail[0][0],sy(trail[0][1]));
  for(i=1;i<trail.length;i++){ p=trail[i]; ctx.lineTo(p[0],sy(p[1])); }
  ctx.lineWidth=11; ctx.strokeStyle='rgba(125,255,212,.16)'; ctx.stroke();
  ctx.lineWidth=5; ctx.strokeStyle='rgba(125,255,212,.5)'; ctx.stroke();
  ctx.lineWidth=2.2; ctx.strokeStyle='#eafff8'; ctx.stroke();
}
function drawDot(){
  var c=corridor(wy(dotY)), m=c.hw-Math.abs(dotX-c.x);
  var danger=clamp(1-(m-R)/26,0,1);
  ctx.save();
  ctx.shadowColor='rgba(125,255,212,.9)'; ctx.shadowBlur=18;
  ctx.fillStyle=danger>.5?'#ffd0d0':'#ffffff';
  ctx.beginPath(); ctx.arc(dotX,dotY,R,0,6.2832); ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(255,'+Math.round(255-danger*170)+','+Math.round(255-danger*170)+',.8)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(dotX,dotY,R+5+Math.sin(time*9)*1.4,0,6.2832); ctx.stroke();
}
function drawSparks(){
  for(var i=0;i<sparks.length;i++){
    var s=sparks[i];
    ctx.globalAlpha=clamp(s.t,0,1); ctx.fillStyle='#ff9d9d';
    ctx.beginPath(); ctx.arc(s.x,sy(s.wy),2.3,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawReady(){
  var a=0.5+0.5*Math.sin(time*4);
  ctx.save();
  ctx.strokeStyle='rgba(125,255,212,'+(0.45+0.45*a)+')'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(startX,startY,30+a*8,0,6.2832); ctx.stroke();
  ctx.fillStyle='rgba(125,255,212,.9)';
  ctx.beginPath(); ctx.arc(startX,startY,6,0,6.2832); ctx.fill();
  ctx.textAlign='center'; ctx.fillStyle='rgba(234,255,248,.92)';
  ctx.font='600 15px system-ui,sans-serif';
  ctx.fillText('Giữ vòng sáng rồi kéo — hoặc giữ nút tròn', startX, startY+68);
  ctx.restore();
}
function drawStick(){
  var alpha;
  if(state==='ready') alpha=0.6+0.3*Math.sin(time*4);
  else if(mode==='stick' && (state==='run'||state==='over')) alpha=state==='run'?1:0.45;
  else return;
  var bx=JX, by=JY;
  if(mode==='stick' && anchor && state!=='ready'){ bx=anchor.px; by=anchor.py; }
  ctx.save();
  ctx.globalAlpha=alpha;
  var g=ctx.createRadialGradient(bx,by,8,bx,by,JR);
  g.addColorStop(0,'rgba(125,255,212,.10)'); g.addColorStop(1,'rgba(125,255,212,.03)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bx,by,JR,0,6.2832); ctx.fill();
  ctx.strokeStyle='rgba(125,255,212,.55)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(bx,by,JR,0,6.2832); ctx.stroke();
  ctx.fillStyle='rgba(125,255,212,.5)';
  for(var k=0;k<4;k++){                     // 4 mũi tên hướng
    var a=k*Math.PI/2;
    ctx.save(); ctx.translate(bx+Math.cos(a)*(JR-12), by+Math.sin(a)*(JR-12)); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(5,0); ctx.lineTo(-3,-5); ctx.lineTo(-3,5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  var kx=bx+(state==='run'&&mode==='stick'?stickX:0), ky=by+(state==='run'&&mode==='stick'?stickY:0);
  ctx.shadowColor='rgba(125,255,212,.8)'; ctx.shadowBlur=16;
  var kg=ctx.createRadialGradient(kx-6,ky-8,3,kx,ky,JK);
  kg.addColorStop(0,'#eafff8'); kg.addColorStop(1,'#49d8c0');
  ctx.fillStyle=kg; ctx.beginPath(); ctx.arc(kx,ky,JK,0,6.2832); ctx.fill();
  ctx.restore();
}
function drawVignette(){
  var g=ctx.createLinearGradient(0,0,0,110);
  g.addColorStop(0,'rgba(4,7,14,.85)'); g.addColorStop(1,'rgba(4,7,14,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,110);
  var g2=ctx.createLinearGradient(0,H-90,0,H);
  g2.addColorStop(0,'rgba(4,7,14,0)'); g2.addColorStop(1,'rgba(4,7,14,.8)');
  ctx.fillStyle=g2; ctx.fillRect(0,H-90,W,90);
}
function draw(){
  ctx.save();
  if(shake>0) ctx.translate(rnd(-1,1)*shake*8, rnd(-1,1)*shake*8);
  drawBg();
  if(wps.length>1){
    drawMaze();
    drawTrail();
    drawSparks();
    if(state==='ready') drawReady();
    if(state==='run'||state==='over') drawDot();
  }
  drawVignette();
  drawStick();
  if(state==='run'){
    ctx.textAlign='center'; ctx.fillStyle='rgba(234,255,248,.5)';
    ctx.font='700 13px system-ui,sans-serif';
    ctx.fillText('ĐỪNG NHẤC TAY', W/2, 104);
  }
  ctx.restore();
}

};
function netState(){ return NET ? NET.state() : {configured:false, ready:true, user:null, busy:false, error:''}; }
function initial(name){
  var sp=document.createElement('span'); sp.className='av';
  var m=String(name||'?').trim().match(/^[\uD800-\uDBFF][\uDC00-\uDFFF]|^[\s\S]/);     // không cắt đôi emoji
  sp.textContent=(m?m[0]:'?').toUpperCase();
  return sp;
}
function avatar(name, photo){

function renderAcct(s){

    : u ? (s.serverBest ? 'Kỷ lục trên bảng xếp hạng: '+s.serverBest+' m' : 'Điểm cao nhất sẽ tự lưu lên bảng xếp hạng.')

var memRuns=[];                              // dùng khi trình duyệt chặn localStorage
function localRuns(){
  var a=null;
  try{ a=JSON.parse(localStorage.getItem('oneline.runs')||'null'); }catch(e){}
  if(!Array.isArray(a)) a=memRuns;
  return a.filter(function(x){ return x && typeof x.m==='number' && x.m>0 && isFinite(x.m); });
}
function saveLocalRun(m){
  if(m<1) return;
  var a=localRuns(); a.push({m:m|0, t:Date.now()});
  a.sort(function(x,y){ return y.m-x.m; }); a=a.slice(0,10); memRuns=a;
  try{ localStorage.setItem('oneline.runs', JSON.stringify(a)); }catch(e){}
}
function runDate(ts){ var d=new Date(ts); return isNaN(d.getTime())||!(ts>1e11) ? '—' : d.toLocaleDateString('vi-VN'); }
// Đưa kỷ lục lên máy chủ; el (nếu có) là dòng trạng thái ở màn thua
function syncScore(el){
  var s=netState(), id=++runSeq;
  if(el) el.textContent = !s.configured ? '' : !s.user ? 'Đăng nhập để lưu điểm lên bảng xếp hạng.' : 'Đang lưu điểm…';
  if(!s.configured || !s.user || best<1){ if(el && s.user) el.textContent=''; return; }
  NET.submit(best).then(function(r){
    if(r.status==='saved' && !pBoard.classList.contains('hide')) loadBoard();
    if(!el || id!==runSeq) return;
    if(r.status==='saved'){
      el.textContent='Kỷ lục mới đã lưu lên bảng xếp hạng!';
      return NET.myRank().then(function(rk){ if(id===runSeq && rk) el.textContent='Kỷ lục mới đã lưu · hạng #'+rk; });
    }
    el.textContent = r.status==='not-better' ? 'Kỷ lục trên bảng xếp hạng: '+(r.best|0)+' m' : '';
  }).catch(function(){ if(el && id===runSeq) el.textContent='Chưa lưu được điểm — kiểm tra kết nối mạng.'; });
}
function netAfterRun(m){ saveLocalRun(m); syncScore($('oNet')); }
function boardRow(rank, name, photo, m, me){
  var li=document.createElement('li');
  if(rank<=3) li.className='r'+rank;
  if(me) li.className+=' me';
  var rk=document.createElement('span'); rk.className='rk'; rk.textContent=rank;
  var nm=document.createElement('span'); nm.className='nm'; nm.textContent=name;
  var sc=document.createElement('span'); sc.className='sc'; sc.textContent=m+' m';
  li.appendChild(rk); if(photo!==false) li.appendChild(avatar(name,photo)); li.appendChild(nm); li.appendChild(sc);
  return li;
}
function boardMsg(t){ var l=$('bdList'); l.textContent=''; var li=document.createElement('li'); li.className='msg'; li.textContent=t; l.appendChild(li); }
function loadBoard(){
  var s=netState(), list=$('bdList'), me=$('bdMe'), id=++boardSeq;
  me.textContent=boardNotice; delArmed=0; $('bDelete').textContent='Xoá dữ liệu của tôi'; $('bDelete').disabled=false;
  $('bDelete').classList.toggle('hide', !s.user);
  if(!s.configured){
    $('bdSub').textContent='Kỷ lục trên máy này';
    var runs=localRuns(); list.textContent='';
    if(!runs.length) return boardMsg('Chưa có lượt chơi nào.');
    runs.forEach(function(r,i){ list.appendChild(boardRow(i+1, runDate(r.t), false, r.m|0, false)); });
    return;
  }
  $('bdSub').textContent='Toàn cầu · top 20';
  boardMsg('Đang tải…');
  NET.top(20).then(function(rows){
    if(id!==boardSeq) return;
    list.textContent='';
    if(!rows.length) boardMsg('Chưa có ai — hãy là người đầu tiên!');
    var uid=s.user&&s.user.uid;
    rows.forEach(function(r){ list.appendChild(boardRow(r.rank, r.name, r.photo, r.best, r.uid===uid)); });
    if(boardNotice) return;
    if(!s.user){ me.textContent='Đăng nhập để có tên trên bảng xếp hạng.'; return; }
    return NET.myRank().then(function(rk){
      if(id===boardSeq) me.textContent = rk ? 'Bạn: hạng #'+rk+' · '+NET.state().serverBest+' m' : 'Bạn chưa có điểm trên bảng xếp hạng.';
    });
  }).catch(function(){ if(id===boardSeq) boardMsg('Không tải được bảng xếp hạng. Kiểm tra kết nối mạng.'); });
}
function openBoard(){
  pStart.classList.add('hide'); pOver.classList.add('hide');
  pBoard.classList.remove('hide'); loadBoard();
}
function closeBoard(){
  pBoard.classList.add('hide'); boardNotice='';
  if(state==='over') pOver.classList.remove('hide');
  else if(state==='idle') pStart.classList.remove('hide');
}
(function(){
  var bs=document.querySelectorAll('[data-login]');
  for(var i=0;i<bs.length;i++) (function(b){
    b.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
    b.addEventListener('click',function(e){
      e.stopPropagation(); if(!NET) return;
      log('login '+b.getAttribute('data-login')+' native='+(NET.native||'-'));
      NET.login(b.getAttribute('data-login'));
    });
  })(bs[i]);
})();
btn('bLogout',function(){ if(NET) NET.logout(); });
btn('bLogout2',function(){ if(NET) NET.logout(); });
btn('bBoard1',openBoard);
btn('bBoard2',openBoard);
btn('bClose',closeBoard);
btn('bDelete',function(){
  if(!NET) return;
  var b=$('bDelete');
  if(Date.now()-delArmed>4000){ delArmed=Date.now(); b.textContent='Bấm lần nữa để xoá vĩnh viễn'; return; }
  delArmed=0; b.textContent='Đang xoá…'; b.disabled=true;
  NET.deleteMe().then(function(r){
    boardNotice = r && r.account===false
      ? 'Đã xoá điểm của bạn. Tài khoản đăng nhập vẫn còn trên máy chủ: hãy đăng nhập lại rồi bấm Xoá lần nữa trong 5 phút để xoá hẳn.'
      : 'Đã xoá toàn bộ dữ liệu của bạn trên máy chủ.';
    loadBoard();
  }).catch(function(){ b.disabled=false; b.textContent='Không xoá được — thử lại'; });
});
pStart.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
pOver.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
pBoard.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
if(NET) NET.onChange(function(s){
  renderAcct(s);
  // mốc chẩn đoán đăng nhập (không ghi tên, mã tài khoản hay token)
  var a='auth user='+(s.user?1:0)+' busy='+(s.busy?1:0)+' err='+(s.error?String(s.error).replace(/\s+/g,' '):'-');
  if(s.configured && s.ready && a!==lastAuth){ lastAuth=a; log(a); }
  var uid=s.user?s.user.uid:null;
  if(uid!==lastUid){
    lastUid=uid;
    if(uid){ boardNotice=''; syncScore(state==='over' ? $('oNet') : null); }   // vừa đăng nhập: đưa kỷ lục trên máy lên
    else if(state==='over') $('oNet').textContent = s.configured ? 'Đăng nhập để lưu điểm lên bảng xếp hạng.' : '';
    if(!pBoard.classList.contains('hide')) loadBoard();
  }
});
else renderAcct(netState());
$('ver').textContent='v'+VERSION;

/* ---------- vòng lặp ---------- */
var frameErr=0;
function loop(ts){
  if(!last) last=ts;
  var dt=clamp((ts-last)/1000,0,0.05); last=ts;
  // tự chỉnh lại khung nếu lỡ sự kiện resize (WebView vừa có kích thước, đổi màn hình, đổi tỉ lệ điểm ảnh)
  refit();                                   // lỡ sự kiện resize / WebView vừa có kích thước / đổi tỉ lệ điểm ảnh: dàn lại ngay
  try{ step(dt); draw(); }
  catch(e){ if(frameErr++<3 && window.console) console.error('[oneline] frame error', e); }
  requestAnimationFrame(loop);
}
/*__TEST_HOOK__*/
fit(); reset(); state='idle';
booted=Date.now();
log('boot v'+VERSION+' online='+(NET?(netState().configured?'on':'off'):'none')+' pointer='+(window.PointerEvent?1:0)+' best='+best+' view='+fitW+'x'+fitH);
requestAnimationFrame(loop);
})();
if(location.protocol==='http:'||location.protocol==='https:'){
  window.addEventListener('load',function(){
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
